  detail: APS publishes no developer portal, API documentation or machine-readable contract. api.aps.com and developer.aps.com
    do not resolve; contract discovery across www, build, careers and marketplace found no OpenAPI, AsyncAPI or
    GraphQL (marketplace.aps.com/mcp answers 403 to every path, opaque). No Green Button Connect My Data program
    page exists in the sitemap (/Residential/Account/Green-Button 404s); customer data access is limited to logged-in
    usage downloads (Billing-and-Payment/Download-Usage) and EDI bill-file downloads (/en/EDI/EDI-Download-Bill-Files)
    for business accounts.
